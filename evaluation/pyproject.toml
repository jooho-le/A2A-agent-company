[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-evaluation"
version = "0.2.0"
description = "Local evaluation and dev report contract adapters"
requires-python = ">=3.10"
dependencies = ["jsonschema[format]>=4.18,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["evaluation", "evaluation.contracts"]
package-dir = {evaluation = "."}

[tool.setuptools.package-data]
evaluation = ["contracts/*.json", "contracts/README.md"]
