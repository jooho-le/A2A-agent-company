<h4>첫 고객은 PM·QA를 겸하는 2~5인 개발팀입니다.</h4>
<p>v08 1~2장. 경제적 구매자는 대표·기술 공동창업자, 주 사용자는 개발 리드·PM 겸임 개발자다. 반복 업무가 있고 이를 줄이기 위해 구독료를 내는지 인터뷰로 확인한다. 금융·의료·결제 핵심 시스템, 무검수 실서비스 배포, 외부 모델 사용 금지 소스, 대규모 시스템은 초기 대상에서 제외한다. 초기 고객을 확보했다는 실적이 아닌 ICP 가설이다.</p>
