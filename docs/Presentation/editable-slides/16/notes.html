<p>API 교환은 네트워크, 공급자 처리, 본문 수신을 포함한다. Agent 처리는 이 API 교환을 포함하므로 합산하지 않는다. Security의 전달 중앙값은 다른 역할보다 컸으나 병렬 스케줄링과 이벤트 루프도 포함한 소수 표본이므로 원인을 단정하지 않는다. 전달 유실 여부는 시간 차이가 아닌 15건의 내용 대조로 확인했다. 표는 11월 13일 원자료에서 재집계했다.</p>
