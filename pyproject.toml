[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-orchestrator"
version = "0.1.0"
description = "A2A multi-agent workflow orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "a2a-sdk>=1.0.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "jsonschema[format]>=4.18,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.setuptools.package-data]
evaluation = ["contracts/*.json", "contracts/README.md"]
